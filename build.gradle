plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gluescompat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// 本模组只使用 Fabric Loader 自带的 Mixin，不依赖 Fabric API。
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ---------------------------------------------------------------------------
// CI 自愈发布：在 GitHub Actions 里构建成功后，自动把最终模组 jar 提交回
// 仓库的 release/ 目录（由 GITHUB_TOKEN 推送的 commit 不会再次触发工作流，
// 不会死循环）。这样玩家随时能在仓库里直接拿到编译好的成品。
// ---------------------------------------------------------------------------
if (System.getenv("GITHUB_ACTIONS") == "true" && System.getenv("GITHUB_EVENT_NAME") == "push") {
	def publishBranch = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("")
	def repoDir = layout.projectDirectory
	def libsDir = layout.buildDirectory.dir("libs")
	def releaseDir = layout.projectDirectory.dir("release")

	tasks.register("publishModJarToRepo") {
		onlyIf { !publishBranch.isEmpty() }

		doLast {
			// 用 GitHub Actions 注解作为反馈通道（沙箱拿不到完整日志）
			def announce = { String level, String msg ->
				println "::${level}::[publish] ${msg.toString().replace('\n', ' | ').replace('\r', ' ')}"
			}
			try {
				announce("notice", "开始发布，目标分支=${publishBranch}")

				def libs = libsDir.get().asFile
				def out = releaseDir.asFile
				out.mkdirs()

				def allFiles = libs.listFiles()?.collect { it.name } ?: []
				announce("notice", "build/libs 内容: ${allFiles}")

				def copied = []
				libs.listFiles()?.each { f ->
					if (f.name.endsWith(".jar") && !f.name.contains("-dev") && !f.name.contains("-sources")) {
						def target = new File(out, f.name)
						target.bytes = f.bytes
						copied << target.name
					}
				}

				if (copied.isEmpty()) {
					announce("warning", "没有找到最终模组 jar，跳过发布")
					return
				}
				announce("notice", "已复制 jar: ${copied}")

				def workDir = repoDir.asFile
				def git = { List<String> cmd ->
					def proc = new ProcessBuilder(cmd).directory(workDir).redirectErrorStream(true).start()
					def text = proc.inputStream.text
					int code = proc.waitFor()
					if (code != 0) {
						throw new GradleException("git 命令失败(exit=$code): ${cmd.join(' ')}\n${text}")
					}
					return text
				}

				git(["git", "config", "user.name", "github-actions[bot]"])
				git(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])

				// 诊断：远端地址与本地凭据配置（打码）
				announce("notice", "remote: ${git(['git', 'remote', '-v']).trim()}")
				def localCfg = git(['git', 'config', '--local', '--list'])
				def masked = localCfg.readLines().collect { l ->
					l.toLowerCase().contains("extraheader") || l.toLowerCase().contains("password") ? (l.split("=")[0] + "=***masked***") : l
				}.join(" ; ")
				announce("notice", "git local config: ${masked}")

				git(["git", "add", "release"])

				def noChanges = new ProcessBuilder(["git", "diff", "--cached", "--quiet"])
						.directory(workDir).start().waitFor() == 0
				if (noChanges) {
					announce("notice", "jar 无变化，跳过提交")
					return
				}

				git(["git", "commit", "-m", "[artifacts] CI 编译产物更新（可直接安装的模组 jar）"])
				def pushOut = git(["git", "push", "origin", "HEAD:refs/heads/${publishBranch}".toString()])
				announce("notice", "已把 ${copied} 发布到 release/ 目录。push 输出: ${pushOut.take(200)}")
			} catch (Exception e) {
				// 发布失败不影响构建结果本身
				announce("error", "发布失败（不影响构建结果）：${e.message?.take(500)}")
			}
		}
	}

	tasks.named("build") {
		finalizedBy("publishModJarToRepo")
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
